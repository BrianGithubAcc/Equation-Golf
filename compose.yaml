services:
  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: equationgolf
      POSTGRES_PASSWORD: equationgolf
      POSTGRES_DB: equationgolf

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - equation-golf-db:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U equationgolf -d equationgolf"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  equation-golf-db:
